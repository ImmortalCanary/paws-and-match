name: Extended demo tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  extended-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: paws_match_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ci_only_password
      PGDATABASE: paws_match_test
    steps:
      - uses: actions/checkout@v4
      - name: Install client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build extended demo and test
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f database/001_schema.sql
          psql -X -v ON_ERROR_STOP=1 -f database/002_demo_data.sql
          psql -X -v ON_ERROR_STOP=1 -f database/migrations/006_matching_v2.sql
          psql -X -v ON_ERROR_STOP=1 -f database/migrations/007_medizinische_merkmale.sql
          psql -X -v ON_ERROR_STOP=1 -f database/seeds/008_erweiterte_demo.sql
          psql -X -v ON_ERROR_STOP=1 -f database/tests/004_erweiterte_demo.sql
          psql -X -v ON_ERROR_STOP=1 -f database/009_standort_matching.sql
